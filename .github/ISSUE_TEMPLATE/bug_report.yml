name: Bug report
description: Report a reproducible problem in Skai Desktop.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Do not include conversation contents, credentials, access tokens, private paths, or other sensitive data.
  - type: input
    id: version
    attributes:
      label: Skai Desktop version
      placeholder: e.g. 0.1.3
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Operating system and version
      placeholder: e.g. Windows 11 24H2 x64
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest sequence that reproduces the problem.
      placeholder: "1. Open…\n2. Select…\n3. Observe…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics
      description: Include relevant error text only after removing private content, tokens, usernames, and local paths.
    validations:
      required: false
