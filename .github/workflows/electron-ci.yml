name: Electron replacement CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: electron-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replacement-build:
    name: Electron replacement · build and protocol smoke
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install Electron dependencies
        run: npm ci --prefix apps/desktop

      - name: Ensure Electron runtime payload
        run: node apps/desktop/node_modules/electron/install.js

      - name: Typecheck Electron renderer
        run: npm run desktop:typecheck

      - name: Repository and release checks
        run: |
          npm run check:syntax
          npm run check:hygiene
          npm run check:release-config
          npm run audit:release-workflow

      - name: Audit Electron replacement boundary
        run: |
          npm run audit:electron-runtime
          npm run audit:electron-tray
          npm run audit:bridge-methods
          npm run audit:local-only

      - name: Electron main-process unit checks
        run: |
          npm run test:pet
          npm run test:linux-windowing

      - name: Build Electron renderer
        run: npm run desktop:build

      - name: Stage packaged Electron artifact
        run: npm run package:electron

      - name: Prepare Linux Electron sandbox
        shell: bash
        run: |
          set -euo pipefail
          sandbox="$GITHUB_WORKSPACE/dist/electron/linux-x64/chrome-sandbox"
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
          stat -c '%U:%G %a %n' "$sandbox"

      - name: Install Linux Electron display dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap python3 xvfb

      - name: Smoke packaged Electron artifact
        run: xvfb-run -a npm run smoke:electron:artifact

      - name: Smoke packaged accessibility and keyboard navigation
        run: xvfb-run -a npm run smoke:electron:accessibility

      - name: UI matrix smoke (routes x window sizes x themes)
        run: xvfb-run -a npm run smoke:electron:ui-matrix

      - name: Build persistent agent host
        run: npm run agent-host:build

      - name: Core tests
        run: npm test

      - name: Smoke replacement protocol
        run: npm run smoke:agent-host

      - name: Smoke bounded project browser
        run: npm run smoke:project-browser

      - name: Smoke bounded project terminal
        run: npm run smoke:project-terminal

      - name: Smoke reviewed project editor
        run: npm run smoke:project-editor

      - name: Smoke conversation search
        run: npm run smoke:conversation-search

      - name: Smoke conversation metadata
        run: npm run smoke:conversation-metadata

      - name: Smoke durable chat queue
        run: npm run smoke:chat-queue

  windows-smoke:
    name: Windows Electron smoke
    runs-on: windows-2022
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Install Electron dependencies
        run: npm ci --prefix apps/desktop

      - name: Ensure Electron runtime payload
        run: node apps/desktop/node_modules/electron/install.js

      - name: Smoke the Windows package and runtime
        run: npm run smoke:windows
