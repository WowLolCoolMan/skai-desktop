name: Build Skai Desktop release artifacts

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Linux Coding Agent sandbox
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap python3
      - run: npm ci
      - run: npm run check:syntax
      - run: npm run check:hygiene
      - run: npm run check:release-config
      - run: npm run audit:release-workflow
      - run: npm run audit:electron-runtime
      - run: npm run audit:electron-tray
      - run: npm run audit:local-only
      - run: npm run check:release-readiness
      - run: npm test
      - run: npm run agent-host:build

  electron:
    name: Package Electron ${{ matrix.rid }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            rid: win-x64
            executable: Skai Desktop.exe
          - os: ubuntu-24.04
            rid: linux-x64
            executable: Skai Desktop
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_SIGNING_READY: ${{ vars.RELEASE_SIGNING_READY }}
      RELEASE_UNSIGNED_TEST: ${{ vars.RELEASE_UNSIGNED_TEST }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Install Electron dependencies
        run: npm ci --prefix apps/desktop
      - name: Ensure Electron runtime payload
        run: node apps/desktop/node_modules/electron/install.js
      - name: Typecheck and build Electron renderer
        run: |
          npm run desktop:typecheck
          npm run desktop:build
      - name: Stage packaged Electron artifact
        run: npm run package:electron
      - name: Prepare Linux Electron sandbox
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sandbox="$GITHUB_WORKSPACE/dist/electron/linux-x64/chrome-sandbox"
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
          stat -c '%U:%G %a %n' "$sandbox"
      - name: Smoke-test exact packaged Electron artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: npm run smoke:electron:artifact
      - name: Audit exact Windows artifact accessibility
        if: runner.os == 'Windows'
        shell: pwsh
        run: npm run smoke:electron:accessibility
      - name: Run local voice acceptance contract
        run: npm run smoke:voice:acceptance
      - name: Smoke-test exact packaged Electron artifact on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes xvfb
          xvfb-run -a npm run smoke:electron:artifact
      - name: Audit exact Linux artifact accessibility
        if: runner.os == 'Linux'
        shell: bash
        run: xvfb-run -a npm run smoke:electron:accessibility
      - name: Build updater-compatible Linux AppImage
        if: runner.os == 'Linux'
        run: npm run package:linux:appimage
      - name: Verify Linux updater metadata against the exact AppImage
        if: runner.os == 'Linux'
        run: node scripts/validate-update-metadata.cjs dist/installer/linux-x64/latest-linux.yml dist/installer/linux-x64
      - name: Sign Windows Electron payload
        if: runner.os == 'Windows' && env.RELEASE_SIGNING_READY == 'true'
        shell: pwsh
        env:
          WINDOWS_CODESIGN_CERT_BASE64: ${{ secrets.WINDOWS_CODESIGN_CERT_BASE64 }}
          WINDOWS_CODESIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_CERT_PASSWORD }}
          WINDOWS_CODESIGN_TIMESTAMP_URL: ${{ vars.WINDOWS_CODESIGN_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_CERT_BASE64) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_CERT_PASSWORD) -or [string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_TIMESTAMP_URL)) { throw 'Windows signing is enabled but certificate, password, or timestamp URL is missing.' }
          $publish = Join-Path $env:GITHUB_WORKSPACE 'dist/electron/win-x64'
          $cert = Join-Path $env:RUNNER_TEMP 'skai-electron-signing.pfx'
          [IO.File]::WriteAllBytes($cert, [Convert]::FromBase64String($env:WINDOWS_CODESIGN_CERT_BASE64))
          "WIN_CSC_LINK=$cert" | Add-Content -Encoding utf8 $env:GITHUB_ENV
          "CSC_LINK=$cert" | Add-Content -Encoding utf8 $env:GITHUB_ENV
          "CSC_KEY_PASSWORD=$env:WINDOWS_CODESIGN_CERT_PASSWORD" | Add-Content -Encoding utf8 $env:GITHUB_ENV
          "WIN_CSC_KEY_PASSWORD=$env:WINDOWS_CODESIGN_CERT_PASSWORD" | Add-Content -Encoding utf8 $env:GITHUB_ENV
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Filter signtool.exe -Recurse | Where-Object FullName -Match '\\x64\\signtool.exe$' | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signtool) { throw 'signtool.exe was not found on the Windows runner.' }
          $host = Join-Path $publish 'resources/agent-host/SkaiDesktop.AgentHost.exe'
          $targets = @((Join-Path $publish 'Skai Desktop.exe'), $host)
          $signatureEvidence = Join-Path $env:RUNNER_TEMP 'SIGNATURES-electron-win-x64.txt'
          foreach ($target in $targets) {
            if (-not (Test-Path $target)) { throw "Windows signing target is missing: $target" }
            & $signtool.FullName sign /fd SHA256 /f $cert /p $env:WINDOWS_CODESIGN_CERT_PASSWORD /tr $env:WINDOWS_CODESIGN_TIMESTAMP_URL /td SHA256 $target
            if ($LASTEXITCODE -ne 0) { throw "Electron Authenticode signing failed: $target" }
            $signature = Get-AuthenticodeSignature -LiteralPath $target
            if ($signature.Status -ne 'Valid') { throw "Authenticode signature did not validate for $target: $($signature.Status)" }
            $hash = (Get-FileHash -Algorithm SHA256 $target).Hash.ToLowerInvariant()
            "file=$([IO.Path]::GetFileName($target))`nstatus=$($signature.Status)`nsubject=$($signature.SignerCertificate.Subject)`nsha256=$hash`n" | Add-Content -Encoding utf8 $signatureEvidence
          }
          $manifestPath = Join-Path $publish 'artifact-manifest.json'
          if (-not (Test-Path $manifestPath)) { throw 'The packaged artifact manifest is missing before Windows signing.' }
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $manifest.files.executable = (Get-FileHash -Algorithm SHA256 (Join-Path $publish 'Skai Desktop.exe')).Hash.ToLowerInvariant()
          $manifest.files.agentHost = (Get-FileHash -Algorithm SHA256 $host).Hash.ToLowerInvariant()
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 $manifestPath
          $verified = Get-Content $manifestPath -Raw | ConvertFrom-Json
          if ($verified.files.executable -ne $manifest.files.executable -or $verified.files.agentHost -ne $manifest.files.agentHost) { throw 'Signed binary hashes were not persisted to artifact-manifest.json.' }
      - name: Build and verify the signed Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          # Keep the strict signature contract visible to the release audit. In
          # unsigned test mode the packaging helper is explicitly overridden by
          # SKAI_ALLOW_UNSIGNED_INSTALLER and the validation below records the
          # untrusted status instead of treating it as a production release.
          SKAI_REQUIRE_SIGNED_INSTALLER: 'true'
          SKAI_ALLOW_UNSIGNED_INSTALLER: ${{ vars.RELEASE_UNSIGNED_TEST == 'true' && 'true' || 'false' }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_SIGNING_READY -ne 'true' -and $env:RELEASE_UNSIGNED_TEST -ne 'true') { throw "Neither signed release mode nor unsigned test mode is enabled." }
          npm run package:windows:installer
          if ($LASTEXITCODE -ne 0) { throw 'The signed NSIS installer build failed.' }
          $installer = Join-Path $env:GITHUB_WORKSPACE 'dist/installer/win-x64/Skai-Desktop-0.1.4-Setup-x64.exe'
          $signature = Get-AuthenticodeSignature -LiteralPath $installer
          if ($env:RELEASE_SIGNING_READY -eq 'true' -and $signature.Status -ne 'Valid') { throw "Installer Authenticode signature did not validate: $($signature.Status)" }
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          "file=$([IO.Path]::GetFileName($installer))`nstatus=$($signature.Status)`nsubject=$($signature.SignerCertificate.Subject)`nsha256=$hash`n" | Add-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'SIGNATURES-electron-win-x64.txt')
      - name: Check out the previous release for upgrade testing
        if: runner.os == 'Windows'
        uses: actions/checkout@v7
        with:
          ref: v0.1.3
          path: .tmp/release-v0.1.3
      - name: Build the signed previous-version installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CODESIGN_CERT_BASE64: ${{ secrets.WINDOWS_CODESIGN_CERT_BASE64 }}
          WINDOWS_CODESIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_CERT_PASSWORD }}
          WINDOWS_CODESIGN_TIMESTAMP_URL: ${{ vars.WINDOWS_CODESIGN_TIMESTAMP_URL }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_SIGNING_READY -ne 'true' -and $env:RELEASE_UNSIGNED_TEST -ne 'true') { throw "Neither signed release mode nor unsigned test mode is enabled." }
          $previous = Join-Path $env:GITHUB_WORKSPACE '.tmp/release-v0.1.3'
          npm ci --prefix (Join-Path $previous 'apps/desktop')
          if ($LASTEXITCODE -ne 0) { throw 'Previous release dependency installation failed.' }
          node (Join-Path $previous 'apps/desktop/node_modules/electron/install.js')
          if ($LASTEXITCODE -ne 0) { throw 'Previous Electron runtime download failed.' }
          npm --prefix (Join-Path $previous 'apps/desktop') run build
          if ($LASTEXITCODE -ne 0) { throw 'Previous renderer build failed.' }
          npm --prefix $previous run package:electron
          if ($LASTEXITCODE -ne 0) { throw 'Previous Electron package build failed.' }
          $previousPackage = Join-Path $previous 'dist/electron/win-x64'
          $targets = @((Join-Path $previousPackage 'Skai Desktop.exe')) + @(Get-ChildItem (Join-Path $previousPackage 'resources/agent-host') -Filter '*.exe' | ForEach-Object FullName)
          if ($env:RELEASE_SIGNING_READY -eq 'true') {
            $cert = Join-Path $env:RUNNER_TEMP 'skai-electron-signing.pfx'
            [IO.File]::WriteAllBytes($cert, [Convert]::FromBase64String($env:WINDOWS_CODESIGN_CERT_BASE64))
            $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Filter signtool.exe -Recurse | Where-Object FullName -Match '\\x64\\signtool.exe$' | Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $signtool) { throw 'signtool.exe was not found on the Windows runner.' }
            foreach ($target in $targets) {
              & $signtool.FullName sign /fd SHA256 /f $cert /p $env:WINDOWS_CODESIGN_CERT_PASSWORD /tr $env:WINDOWS_CODESIGN_TIMESTAMP_URL /td SHA256 $target
              if ($LASTEXITCODE -ne 0 -or (Get-AuthenticodeSignature -LiteralPath $target).Status -ne 'Valid') { throw "Previous release signature failed: $target" }
            }
          }
          $manifestPath = Join-Path $previousPackage 'artifact-manifest.json'
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          $manifest.files.executable = (Get-FileHash -Algorithm SHA256 (Join-Path $previousPackage 'Skai Desktop.exe')).Hash.ToLowerInvariant()
          $previousHost = $targets | Where-Object { $_ -like '*agent-host*' } | Select-Object -First 1
          if (-not $previousHost) { throw 'Previous Agent Host executable was not found.' }
          $manifest.files.agentHost = (Get-FileHash -Algorithm SHA256 $previousHost).Hash.ToLowerInvariant()
          $manifest | ConvertTo-Json -Depth 5 | Set-Content -Encoding utf8 $manifestPath
          $previousInstallerDir = Join-Path $env:RUNNER_TEMP 'previous-installer'
          $env:SKAI_ALLOW_UNSIGNED_INSTALLER = if ($env:RELEASE_UNSIGNED_TEST -eq 'true') { 'true' } else { 'false' }
          node (Join-Path $env:GITHUB_WORKSPACE 'scripts/package-windows-installer.cjs') $previousPackage $previousInstallerDir
          if ($LASTEXITCODE -ne 0) { throw 'Previous-version NSIS installer build failed.' }
      - name: Install, upgrade, and uninstall the exact signed installers
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SKAI_REQUIRE_SIGNED_INSTALLER: ${{ vars.RELEASE_UNSIGNED_TEST == 'true' && 'false' || 'true' }}
          SKAI_RELEASE_EVIDENCE_PATH: ${{ runner.temp }}\windows-install-lifecycle-evidence.json
        run: |
          $ErrorActionPreference = 'Stop'
          $previousInstaller = Join-Path $env:RUNNER_TEMP 'previous-installer/Skai-Desktop-0.1.3-Setup-x64.exe'
          $currentInstaller = Join-Path $env:GITHUB_WORKSPACE 'dist/installer/win-x64/Skai-Desktop-0.1.4-Setup-x64.exe'
          node scripts/smoke-windows-installer.cjs $previousInstaller $currentInstaller .tmp/release-v0.1.3/scripts/smoke-electron-artifact.cjs
          if ($LASTEXITCODE -ne 0) { throw 'Windows install/upgrade/uninstall lifecycle smoke failed.' }
      - name: Verify the real in-app update feed and install path
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $packagedApp = Join-Path $env:GITHUB_WORKSPACE 'dist/electron/win-x64'
          $currentInstaller = Join-Path $env:GITHUB_WORKSPACE 'dist/installer/win-x64/Skai-Desktop-0.1.4-Setup-x64.exe'
          node scripts/smoke-windows-update-feed.cjs $packagedApp $currentInstaller
          if ($LASTEXITCODE -ne 0) { throw 'Windows in-app update feed/download/install smoke failed.' }
      - name: Sign Linux Electron archive
        if: runner.os == 'Linux' && env.RELEASE_SIGNING_READY == 'true'
        shell: bash
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_GPG_PRIVATE_KEY" ]; then echo 'Linux signing is enabled but RELEASE_GPG_PRIVATE_KEY is missing.' >&2; exit 1; fi
          printf '%s' "$RELEASE_GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Archive Windows Electron artifact
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP 'skai-electron'
          $publish = Join-Path $env:GITHUB_WORKSPACE 'dist/electron/win-x64'
          New-Item -ItemType Directory -Force $root | Out-Null
          Copy-Item 'docs/ELECTRON_DEFAULT_RUNTIME.md' $publish
          Compress-Archive -Path (Join-Path $publish '*') -DestinationPath (Join-Path $root 'Skai-Desktop-electron-win-x64.zip')
          $installer = Join-Path $env:GITHUB_WORKSPACE 'dist/installer/win-x64/Skai-Desktop-0.1.4-Setup-x64.exe'
          Copy-Item $installer $root
          Copy-Item (Join-Path $env:GITHUB_WORKSPACE 'dist/installer/win-x64/latest.yml') $root
          $checksums = @((Get-FileHash -Algorithm SHA256 (Join-Path $root 'Skai-Desktop-electron-win-x64.zip')), (Get-FileHash -Algorithm SHA256 (Join-Path $root 'Skai-Desktop-0.1.4-Setup-x64.exe')))
          $checksums | ForEach-Object { "$($_.Hash.ToLowerInvariant())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content -Encoding ascii (Join-Path $root 'SHA256SUMS-electron-win-x64.txt')
          if (Test-Path (Join-Path $env:RUNNER_TEMP 'SIGNATURES-electron-win-x64.txt')) { Copy-Item (Join-Path $env:RUNNER_TEMP 'SIGNATURES-electron-win-x64.txt') $root }
          Copy-Item (Join-Path $env:RUNNER_TEMP 'windows-install-lifecycle-evidence.json') $root
      - name: Archive and sign Linux Electron artifact
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/skai-electron"
          publish="$GITHUB_WORKSPACE/dist/electron/linux-x64"
          appimage_dir="$GITHUB_WORKSPACE/dist/installer/linux-x64"
          mkdir -p "$root"
          cp "$appimage_dir/Skai-Desktop-0.1.4-x64.AppImage" "$root/"
          cp "$appimage_dir/latest-linux.yml" "$root/"
          cp docs/ELECTRON_DEFAULT_RUNTIME.md "$publish/"
          tar -czf "$root/Skai-Desktop-electron-linux-x64.tar.gz" -C "$publish" .
          sha256sum "$root/Skai-Desktop-electron-linux-x64.tar.gz" > "$root/SHA256SUMS-electron-linux-x64.txt"
          if [ "${RELEASE_SIGNING_READY:-}" = 'true' ]; then
            gpg --batch --yes --armor --detach-sign --output "$root/Skai-Desktop-electron-linux-x64.tar.gz.asc" "$root/Skai-Desktop-electron-linux-x64.tar.gz"
            gpg --batch --yes --armor --detach-sign --output "$root/Skai-Desktop-0.1.4-x64.AppImage.asc" "$root/Skai-Desktop-0.1.4-x64.AppImage"
            gpg --batch --list-secret-keys --with-colons | awk -F: '$1 == "sec" { print "keyid=" $5; exit }' > "$root/SIGNATURES-electron-linux-x64.txt"
            printf 'signature=Skai-Desktop-electron-linux-x64.tar.gz.asc\n' >> "$root/SIGNATURES-electron-linux-x64.txt"
            printf 'signature=Skai-Desktop-0.1.4-x64.AppImage.asc\n' >> "$root/SIGNATURES-electron-linux-x64.txt"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Skai-Desktop-electron-${{ matrix.rid }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/skai-electron/Skai-Desktop-electron-*
            ${{ runner.temp }}/skai-electron/Skai-Desktop-0.1.4-Setup-x64.exe
            ${{ runner.temp }}/skai-electron/Skai-Desktop-0.1.4-x64.AppImage
            ${{ runner.temp }}/skai-electron/latest.yml
            ${{ runner.temp }}/skai-electron/latest-linux.yml
            ${{ runner.temp }}/skai-electron/Skai-Desktop-0.1.4-x64.AppImage.asc
            ${{ runner.temp }}/skai-electron/SIGNATURES-electron-*.txt
            ${{ runner.temp }}/skai-electron/SHA256SUMS-electron-*.txt
            ${{ runner.temp }}/skai-electron/windows-install-lifecycle-evidence.json
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [electron]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Require release gates
        env:
          RELEASE_SIGNING_READY: ${{ vars.RELEASE_SIGNING_READY }}
          RELEASE_UNSIGNED_TEST: ${{ vars.RELEASE_UNSIGNED_TEST }}
          PACKAGED_SMOKE_READY: ${{ vars.PACKAGED_SMOKE_READY }}
          ELECTRON_PACKAGED_READY: ${{ vars.ELECTRON_PACKAGED_READY }}
        run: |
          set -euo pipefail
          for gate in PACKAGED_SMOKE_READY ELECTRON_PACKAGED_READY; do
            if [ "${!gate}" != "true" ]; then
              echo "Release gate ${gate} must be repository variable 'true'." >&2
              exit 1
            fi
          done
          if [ "${RELEASE_SIGNING_READY:-}" != 'true' ] && [ "${RELEASE_UNSIGNED_TEST:-}" != 'true' ]; then
            echo 'Release requires either signing mode or explicitly enabled unsigned test mode.' >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: Skai-Desktop-*
          merge-multiple: true
      - name: Generate release checksums
        run: find release-assets -type f ! -name 'SHA256SUMS*.txt' ! -name 'SIGNATURES*.txt' -print0 | sort -z | xargs -0 sha256sum > release-assets/SHA256SUMS.txt
      - name: Require signed artifact evidence or label unsigned test assets
        run: |
          set -euo pipefail
          if [ "${RELEASE_SIGNING_READY:-}" != 'true' ]; then
            printf 'UNSIGNED TEST RELEASE: artifacts are not trusted publisher-signed.\n' > release-assets/SIGNATURES.txt
            exit 0
          fi
          required_signatures=(
            release-assets/SIGNATURES-electron-win-x64.txt
            release-assets/SIGNATURES-electron-linux-x64.txt
          )
          for signature in "${required_signatures[@]}"; do
            if [ ! -s "$signature" ]; then
              echo "Release blocked: missing signing evidence $signature." >&2
              exit 1
            fi
          done
          cat "${required_signatures[@]}" > release-assets/SIGNATURES.txt
          if [ ! -s release-assets/windows-install-lifecycle-evidence.json ]; then
            echo 'Release blocked: missing clean Windows install/upgrade/uninstall evidence.' >&2
            exit 1
          fi
      - uses: softprops/action-gh-release@v3
        with:
          files: release-assets/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-beta.') }}
